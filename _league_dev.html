<script>
// 自動でリーグモードへ。?end=1 で先頭クラブを選び全節を無音消化して最終話まで一気に進める。
window.addEventListener('load', function () {
  try { showLeague(); } catch (e) { document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f88">' + e.message + '</pre>'); return; }
  var end = /[?&]end=1/.test(location.search);
  if (end) {
    setTimeout(function () {
      var b = document.querySelector('[onclick*="leaguePickClub"]');
      if (b) { var m = b.getAttribute('onclick').match(/leaguePickClub\('([^']+)'\)/); if (m) leaguePickClub(m[1]); }
      setTimeout(function () { if (typeof leagueDebugSimSeason === 'function') leagueDebugSimSeason(); }, 60);
    }, 120);
  }
});
</script>
