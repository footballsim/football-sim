name: Build Obfuscated Output

on:
  push:
    branches: [main]
    paths:
      - 'index.html'   # index.html 変更時のみ実行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build obfuscated output
        run: npm run build

      - name: Commit and push docs/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "build: update obfuscated output [skip ci]" && \
            git push
