<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <title>Sim Football Data Editor</title>

    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="memeid.css" />
    <link rel="stylesheet" href="memeclass.css" />
    <link rel="stylesheet" href="memehtml.css" />
    <script type="text/javascript" src="../js/jquery-1.8.2.min.js"></script>
    <script type="text/javascript">
function deletePlayer(pid){
  if (window.confirm('ID '+pid+' のデータを削除しますか？')) {
    location.href = "{{$root}}admin/editor.php?action=deleteplayer&playerid="+pid;
  }
}
    </script>
  </head>
  <body>
    <div id="wrapper">

      <div id="maintext">

        <div class="bodytext">
          <p>
          <a href="{{$root}}admin/editor.php?action=cards" class="btn">対戦カード</a> &nbsp; 
          <a href="{{$root}}admin/editor.php?action=teams" class="btn btn-secondary">チーム情報</a>&nbsp; 
          <a href="{{$root}}admin/editor.php?action=players" class="btn btn-sub">選 手 情 報</a>
          </p>
        </div>

        <div class="topcopy">
          <h3>選手一覧</h3>
        </div>

        <div class="bodytext">

          <p><a href="{{$root}}admin/editor.php?action=editplayer" class="btn btn-sub">新規選手作成</a></p>

          <table width="90%" border="0" cellspacing="2" cellpadding="5">
            <tbody>
              <tr>
                <td colspan="6" align="right">
                  <form id="mainform" action="{{$root}}admin/editor.php" method="post">
                    <input type="hidden" name="action" value="players"/>
                    <input name="kw" type="text" id="CARD_NAME2" value="{{$kw|escape}}" size="40" />で<input type="submit" name="submit" id="submit" value="絞り込み" />
                  </form>
                </td>
              </tr>
              <tr class="whitetitle">
                <td width="10%" align="center" bgcolor="#005296">選手ID（クリックで編集）</td>
                <td width="15%" align="center" bgcolor="#005296">国籍</td>
                <td width="15%" align="center" bgcolor="#005296">選手区分</td>
                <td align="center" bgcolor="#005296">選手名</td>
                <td width="15%" align="center" bgcolor="#005296">登録日</td>
                <td width="10%" align="center" bgcolor="#005296">削除</td>
              </tr>
              {{foreach from=$data item=i name=list}}
              <tr class="gb1">
                <td><a href="{{$root}}admin/editor.php?action=editplayer&playerid={{$i.playerid|escape}}">{{$i.playerid|escape}}</a></td>
                <td><strong>{{$i.country|escape}}</strong></td>
                <td><strong>{{$i.category|escape}}</strong></td>
                <td><strong>{{$i.longname|escape}} / {{$i.name|escape}}</strong></td>
                <td>{{$i.created|escape}}</td>
                <td>【<a href="#" onclick="deletePlayer({{$i.playerid|escape}});">削除</a>】</td>
              </tr>
              {{/foreach}}
            </tbody>
          </table>
          <div align="center" style="margin: 2em 0;"><input type="button" value="ダウンロード" onclick="location.href='{{$root}}admin/editor.php?action=downloadplayers'"/></div>
          <div align="center" style="margin: 2em 0;">
            <form id="uploadform" action="{{$root}}admin/editor.php?action=uploadplayers" method="post" enctype="multipart/form-data">
              <input type="file" name="upfile" size="30" />
              <input type="submit" name="submit" value="アップロード" class="btn btn-sub"/>
            </form>
          </div>
          <br/>
          <p align="center"><a href="{{$root}}admin/editor.php">TOPに戻る</a></p>
        </div>

      </div>

      <div class="clear"></div>
    </div>
  </body>
</html>
