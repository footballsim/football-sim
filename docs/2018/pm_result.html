    <title>Football Sim [フットボールシム] ｜世界のサッカーをシミュレート</title>
    <meta name="keywords" content="Football sim,フットボールシム,サッカー,シミュレータ,ワールドカップ,W杯,フットボール,日本代表,シミュレーションゲーム">
    <meta name="Description" content="フットボールシム(Football Sim)はサッカーの監督として試合を行うサッカーシミュレータサイト。ワールドカップ2018ロシア大会を日本代表の監督となってプレイできる他、欧州選手権、コパアメリカ、アジアカップなどの大陸別の大会や、Jリーグを含めた各リーグのクラブも随時実装予定です。試合は戦術、フォーメーション等の設定だけでなく、自チームのキープレイヤー、対戦相手の要注意プレイヤーも選択可能で戦い方は無限大！"/>
