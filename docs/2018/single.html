<!doctype html>
<html lang="ja" ng-app="myApp">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>My App</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="bower_components/OnsenUI/css/onsenui.css">
    <link rel="stylesheet" href="bower_components/OnsenUI/css/onsen-css-components.css">

    <script src="bower_components/angular/angular.js"></script>
    <script src="bower_components/OnsenUI/js/onsenui.js"></script>

    <link rel="stylesheet" href="css/app.css?v=0.3.1"/>

    <script src="js/data.js?v=0.3.1"></script>
    <script src="js/game.js?v=0.3.1"></script>
    <script src="js/single.js?v=0.3.1"></script>
  </head>

  <body ng-controller="AppCtrl">

    <ons-screen>
      <ons-navigator var="myNavigator">
        <ons-page id="ingame" ng-controller="InGameCtrl">
          <div align="center">
            <div class="maintext">

              <div class="whitebox">
                <div style="font-size: 120%;">
                  <table width="90%" border="0" cellspacing="5" cellpadding="5" bgcolor="#FFFFFF">
                    <tr>
                      <td width="45%" align="right">{{game.team1.name}}</td>
                      <td align="center">VS</td>
                      <td width="45%" align="left">{{game.team2.name}}</td>
                    </tr>
                    <tr>
                      <td align="right">{{score1}}</td>
                      <td align="center">対</td>
                      <td align="left">{{score2}}</td>
                    </tr>
                  </table>
                </div>

                <div class="fieldbox" id="fieldbox">
                  <img src="images/fieldbg.png" class="fieldimg" id="fieldimg">
                  <div ng-style="matchupPos" class="matchupimage">
                    <img ng-src="face/{{matchup1.playerid}}.png" ng-style="matchupIconSize" /><img ng-src="images/{{ballimage}}.png" alt="VS" ng-style="matchupIconSize" /><img ng-src="face/{{matchup2.playerid}}.png" ng-style="matchupIconSize" />
                  </div>
                </div>
                <div class="guidebox">
                  <table width="100%" border="0" cellspacing="0" cellpadding="10">
                    <tr>
                      <td><img src="face/jikkyo.png" alt="実況アナ" width="50" height="48" align="absmiddle" /></td>
                      <td width="10">&nbsp;</td>
                      <td id="ingame-commentary"></td>
                    </tr>
                  </table>
                  <ons-button ng-click="nextButton()" class="btn" style="margin-top: 10px;">次へ進む</ons-button>
                  <!--
                  <ons-button ng-click="setting()" ng-disabled="settingbuttondisabled" class="btn" style="margin-top: 10px;">チーム設定</ons-button>
                  -->
                </div>
              </div>
            </div>

            <div class="clear"></div>
            <div class="footer">
              <p>　</p>
            </div>
          </div>
        </ons-page>
      </ons-navigator>
    </ons-screen>

  </body>
</html>
