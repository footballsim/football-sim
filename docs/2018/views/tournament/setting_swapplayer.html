<ons-page id="setting-swapplayer" ng-controller="SettingSwapPlayerCtrl">

<ons-toolbar>
<div class="left"><ons-back-button></ons-back-button></div>
<div class="center">選手交代</div>
<div class="right"><ons-button ng-click="submit()" ng-disabled="player1 &lt; 0" class="btn">決定</ons-button></div>
</ons-toolbar>

<div align="center">
  <div class="maintext">

    <div align="center"><img class="autoimg" src="images/startmem.png" alt="メンバー交代" /></div>
    <div class="orangebox">
      <ons-row>
      <ons-col ng-repeat="item in lineup" width="33%">
      <label class="checkbox">
        <p>{{system.positions[$index].replace('SW', 'LB')}}</p>
        <a href="" ng-click="memstatus($index)"><img ng-src="face/{{item.playerid}}.png" class="autoimg" alt="選手イメージ" width="70" height="68"/></a>
        <p><input type="radio" name="player1" ng-model="$parent.player1" ng-value="$index" />{{item.longname}}</p>
      </label>
      </ons-col>
      </ons-row>
      <ons-button ng-click="submit()" ng-disabled="player1 &lt; 0" class="btn" style="margin-top: 10px;">決　　定</ons-button>
      </div>
    </div>

    <div class="clear"></div>
	<div class="footer">
	  <p>　</p>
	</div>
</div>

</ons-page>
