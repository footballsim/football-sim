<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <title>Sim Football Data Editor</title>

    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="memeid.css" />
    <link rel="stylesheet" href="memeclass.css" />
    <link rel="stylesheet" href="memehtml.css" />
    <script type="text/javascript">
function deleteTeam(tid){
  if (window.confirm('ID '+tid+' のデータを削除しますか？')) {
    location.href = "{{$root}}admin/editor.php?action=deleteteam&teamid="+tid;
  }
}
    </script>
  </head>
  <body>
    <div id="wrapper">

      <div id="maintext">

        <div class="bodytext">
          <p>
          <a href="{{$root}}admin/editor.php?action=cards" class="btn">対戦カード</a> &nbsp; 
          <a href="{{$root}}admin/editor.php?action=teams" class="btn btn-secondary">チーム情報</a>&nbsp; 
          <a href="{{$root}}admin/editor.php?action=players" class="btn btn-sub">選 手 情 報</a>
          </p>
        </div>

        <div class="topcopy">
          <h3>チーム一覧</h3>
        </div>

        <div class="bodytext">

          <p><a href="{{$root}}admin/editor.php?action=editteam" class="btn btn-secondary">新規チーム作成</a></p>

          <table width="90%" border="0" cellspacing="2" cellpadding="5">
            <tbody>
              <tr class="whitetitle">
                <td width="10%" align="center" bgcolor="#005296">チームID</td>
                <td width="15%" align="center" bgcolor="#005296">チーム区分</td>
                <td width="15%" align="center" bgcolor="#005296">年号</td>
                <td align="center" bgcolor="#005296">チーム名</td>
                <td width="15%" align="center" bgcolor="#005296">登録日</td>
                <td width="10%" align="center" bgcolor="#005296">削除</td>
              </tr>
              {{foreach from=$data item=i name=list}}
              <tr class="gb1">
                <td><a href="{{$root}}admin/editor.php?action=editteam&teamid={{$i.teamid|escape}}">{{$i.teamid|escape}}</a></td>
                <td><strong>{{$i.category|escape}}</strong></td>
                <td><strong>{{$i.year|escape}}</strong></td>
                <td><strong>{{$i.name|escape}}</strong></td>
                <td>{{$i.created|escape}}</td>
                <td>【<a href="#" onclick="deleteTeam({{$i.teamid|escape}});">削除</a>】</td>
              </tr>
              {{/foreach}}
            </tbody>
          </table>
          <p align="center"><a href="{{$root}}admin/editor.php">TOPに戻る</a></p>
        </div>

      </div>

      <div class="clear"></div>
    </div>
  </body>
</html>
