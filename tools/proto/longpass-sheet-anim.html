<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ロングパス スプライト4コマ・アニメ</title>
<style>
  body{margin:0;background:#0b1e3a;color:#fff;font-family:system-ui,'Noto Sans JP',sans-serif;padding:16px}
  h1{font-size:16px;font-weight:600;margin:0 0 10px}
  canvas{width:480px;height:auto;image-rendering:pixelated;border-radius:10px;display:block;background:#16243f}
  .lab{margin-top:8px;font-size:12px;color:rgba(255,255,255,.8)}
  .frames{display:flex;gap:8px;margin-top:12px}
  .frames img{height:90px;image-rendering:pixelated;background:#223;border-radius:6px}
</style>
</head>
<body>
<h1>ロングパス 4コマ・アニメ（助走→踏込→ストライク→フォロー）＋ボール</h1>
<canvas id="cv" width="480" height="210"></canvas>
<div class="lab" id="lab">loading…</div>
<div class="frames" id="fr"></div>
<script>
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),lab=document.getElementById('lab');
  var W=480,H=210;
  window.A={gx:150,ground:188,scale:0.92,f:[0.25,0.40,0.50,1.0]}; // フレーム切替時刻
  window.B={fx:182,fy:170,tx:470,ty:96,arc:46,r:5}; // ボール 発射→ゴール
  window.FREEZE=null; // 'f1'..'f4' で固定
  function load(s){return new Promise(function(r){var i=new Image();i.onload=function(){r(i);};i.src=s;});}
  Promise.all([1,2,3,4].map(function(n){return load('/tools/art/cutscenes/lp_f'+n+'.png?t='+Date.now());})).then(function(F){
    // サムネ表示
    var fr=document.getElementById('fr'); F.forEach(function(im,i){var c=im.cloneNode();fr.appendChild(c);});
    function bg(){
      var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6a86e8');g.addColorStop(.55,'#6a86e8');g.addColorStop(.56,'#2f7d33');g.addColorStop(1,'#256a2a');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#3a3f6a';ctx.fillRect(0,96,W,22);                  // crowd band
      for(var x=0;x<W;x+=7){ctx.fillStyle=['#cfd8ff','#fff','#e3a9c8'][(x*7)%3];ctx.fillRect(x,98+((x*13)%16),2,2);}
      ctx.fillStyle='#2b7530';for(var s=0;s<W;s+=44)ctx.fillRect(s,118,22,H-118);
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(404,80,66,34);// goal
      ctx.fillStyle='#1a1a2a';ctx.fillRect(434,94,5,16);ctx.beginPath();ctx.arc(436,90,4,0,7);ctx.fill();
    }
    function drawFrame(img){var s=window.A.scale,fw=img.naturalWidth*s,fh=img.naturalHeight*s;
      ctx.imageSmoothingEnabled=false;ctx.drawImage(img,window.A.gx-fw/2,window.A.ground-fh,fw,fh);}
    function ball(u){var B=window.B;var x=B.fx+(B.tx-B.fx)*u,y=B.fy+(B.ty-B.fy)*u-Math.sin(u*Math.PI)*B.arc;
      var r=B.r+Math.sin(u*Math.PI)*16;
      for(var k=4;k>=1;k--){ctx.globalAlpha=0.10*k;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-k*8,y+k*1.5,Math.max(2,r*0.8),0,7);ctx.fill();}
      ctx.globalAlpha=1;ctx.fillStyle='#15101c';ctx.beginPath();ctx.arc(x,y,r+1.3,0,7);ctx.fill();
      ctx.fillStyle='#fafafa';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      var sp=u*16;ctx.fillStyle='#1c1c1c';for(var i=0;i<5;i++){var a=sp+i*1.256;ctx.beginPath();ctx.arc(x+Math.cos(a)*r*0.5,y+Math.sin(a)*r*0.5,r*0.22,0,7);ctx.fill();}}
    var T0=performance.now(),P=2100;
    function frame(now){
      var p=(window.FREEZE!=null)?({f1:0.1,f2:0.33,f3:0.47,f4:0.7})[window.FREEZE]:((now-T0)%P)/P;
      var fa=window.A.f, idx = p<fa[0]?0 : p<fa[1]?1 : p<fa[2]?2 : 3;
      bg();
      var strike=(p>fa[1]&&p<fa[2]+0.04)?1-(p-fa[1])/(fa[2]+0.04-fa[1]):0;
      if(strike>0){ctx.fillStyle='rgba(255,255,255,'+(strike*0.4)+')';ctx.fillRect(0,0,W,H);}
      drawFrame(F[idx]);
      if(p>=fa[2]&&p<0.92){var u=(p-fa[2])/(0.92-fa[2]);ball(u);}
      lab.textContent='phase '+p.toFixed(2)+' frame f'+(idx+1)+(window.FREEZE?'（固定）':'（ループ）');
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
</script>
</body>
</html>
