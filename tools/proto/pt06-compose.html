<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PT-06 compose</title>
<style>
  body { margin:0; background:linear-gradient(160deg,#003087,#0050cc,#1a7a3a); color:#fff; font:13px system-ui; }
  h2 { padding:8px 12px 0; margin:0; }
  #stage { display:flex; flex-wrap:wrap; gap:10px; padding:12px; align-items:flex-end; }
  .cell { text-align:center; background:rgba(0,0,0,.18); border-radius:8px; padding:6px; }
  canvas { image-rendering:auto; }
  .cap { margin-top:4px; font-size:12px; }
</style>
</head>
<body>
<h2>PT-06 頭アンカー合成（プレースホルダボディ）</h2>
<div id="stage"></div>
<script src="/js/portrait.js"></script>
<script>
(function(){
  var stage = document.getElementById('stage');
  // 実選手風の代表名（特徴が散るよう固定）
  var NAMES = ['久保建英','三笘薫','冨安健洋','伊東純也','上田綺世','鎌田大地','遠藤航','谷口彰悟'];

  var body = new Image();
  body.onload = function(){
    Portrait.preload().then(function(){
      // 表示サイズの想定: スプライト全身 ~420px高。ボディnative 1200 → dScale=420/1200
      var DISP_H = 460;
      var dScale = DISP_H / body.naturalHeight;   // ~0.383
      // 頭の目標高さ headH: 実寸で ~120px 想定（BBOX.h=786 全体だが髪頂〜首まで）
      // ボディの首ソケット native (360,300) → dest (360*dScale, 300*dScale)
      var anchorBase = { bw: body.naturalWidth, bh: body.naturalHeight,
                         sx: 360, sy: 300, headH: 150, dScale: dScale };

      NAMES.forEach(function(nm, i){
        [false, true].forEach(function(flip){
          if (flip && i>=2) return; // flipは先頭2名だけ両方見せる（残りはflip=true固定で向き確認）
          var cell = document.createElement('div'); cell.className='cell';
          var cw = Math.round(body.naturalWidth*dScale)+8;
          var ch = Math.round(body.naturalHeight*dScale)+8;
          var cv = document.createElement('canvas'); cv.width=cw; cv.height=ch;
          var ctx = cv.getContext('2d');
          var a = Object.assign({}, anchorBase, { flip:flip });
          var rect = Portrait.composePose(ctx, nm, body, a, { team:'#2050cc' });
          cell.appendChild(cv);
          var cap = document.createElement('div'); cap.className='cap';
          cap.textContent = nm + (flip?' [flip]':'') + '  head '+Math.round(rect.w)+'x'+Math.round(rect.h);
          cell.appendChild(cap);
          stage.appendChild(cell);
        });
      });

      // 比較: 同じ選手を headH 90/120/150 で（頭の可読サイズ確認）
      var sizes=[90,120,150];
      sizes.forEach(function(hh){
        var cell=document.createElement('div'); cell.className='cell';
        var cw=Math.round(body.naturalWidth*dScale)+8, ch=Math.round(body.naturalHeight*dScale)+8;
        var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
        var a=Object.assign({},anchorBase,{headH:hh, flip:false});
        Portrait.composePose(cv.getContext('2d'), '三笘薫', body, a, {team:'#2050cc'});
        cell.appendChild(cv);
        var cap=document.createElement('div'); cap.className='cap'; cap.textContent='三笘 headH='+hh;
        cell.appendChild(cap); stage.appendChild(cell);
      });

      window.__DONE = true;
    });
  };
  body.onerror=function(){ document.body.insertAdjacentHTML('beforeend','<p style="color:#f88">body load failed</p>'); };
  body.src = '/tools/proto/pt06_body_placeholder.png';
})();
</script>
</body>
</html>
