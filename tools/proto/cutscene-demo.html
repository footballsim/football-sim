<h1>ゴール・カットイン デモ（1b・チーム別キット）</h1>
<p class="lead">ボタンを押すとゴールの<b>カットイン takeover</b>。<b>ユニフォーム色は得点チームに合わせて変わります</b>（赤1枚からパレットスワップで生成。HUD も動的）。タップで閉じます。</p>

<div class="screen">
  <div class="sb">
    <span class="chip" style="background:#1f4fd6"></span><span class="nm">JPN</span>
    <span id="bigscore">0 - 0</span>
    <span class="nm">NED</span><span class="chip" style="background:#e36b1f"></span>
    <span class="min">前半</span>
  </div>
  <div class="field"></div>
</div>

<div class="controls">
  <button onclick="goal(0)">⚽ 日本（青）上田 67'</button>
  <button onclick="goal(1)">⚽ スペイン（赤）88'</button>
  <button onclick="goal(2)">⚽ ブラジル（黄）12'</button>
</div>

<p class="note">※ アートは AI 生成1枚（bicycle）＋パレットスワップ。実機 <code>js/cutscene.js</code> は得点チームの色に近い kit を自動選択（赤/青/黄/緑/白/濃）。他のゴール種（header/long_range/save）は素材追加で増えます。</p>

function renderCard(canvas,s){
  var W=360,H=480,ctx=canvas.getContext('2d'),img=IMAGES[s.kit]||IMAGES.red;
  ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
