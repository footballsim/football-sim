<!DOCTYPE html>
<html lang="ja">
<head>

<title>パレットスワップ 比較</title>
<style>
  body{margin:0;background:#0b1e3a;color:#fff;font-family:system-ui,'Noto Sans JP',sans-serif;padding:16px}
  h1{font-size:17px;font-weight:600;margin:0 0 4px}

<div class="row">
  <div class="c"><img src="/tools/art/cutscenes/goal_bicycle_red_01.png"><div>RED（元）</div></div>
  <div class="c"><img src="/tools/art/cutscenes/_rc_blue.png"><div>BLUE</div></div>
  <div class="c"><img src="/tools/art/cutscenes/_rc_yellow.png"><div>YELLOW</div></div>
  <div class="c"><img src="/tools/art/cutscenes/_rc_green.png"><div>GREEN</div></div>
  <div class="c"><img src="/tools/art/cutscenes/_rc_white.png"><div>WHITE</div></div>
  <div class="c"><img src="/tools/art/cutscenes/_rc_dark.png"><div>DARK</div></div>
