<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャプ翼構成 近代化 — 試合画面</title>
<style>
  :root{ --acc:#ff6a1a; --c1:#c8102e; --c2:#111; --ink:#0a0d14; }
  body{background:#0a0d14;color:#dce3ee;font:14px system-ui,sans-serif;margin:0;padding:18px}
  h1{font-size:17px;margin:0 0 2px}
  p.note{color:#9fb0c8;font-size:12px;margin:0 0 16px;max-width:1000px;line-height:1.5}

  .stage{position:relative;width:900px;max-width:96vw;aspect-ratio:16/9;background:#05070c;border-radius:14px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.6);display:flex;flex-direction:column}
  /* 映像（上・大） */
  .film{position:relative;flex:1;overflow:hidden;background:#05070c}
  .film canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
  /* 映像上の軽いビネット＝情報の可読性 */
  .film::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 -40px 60px -20px rgba(4,6,12,.7), inset 0 30px 50px -25px rgba(4,6,12,.55)}
  .tempo{display:flex;gap:3px}
  .tempo span{font:800 11px system-ui;padding:4px 8px;border-radius:7px;background:rgba(16,22,34,.6);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px)}
  .tempo span.on{background:#1f4fd6;color:#fff;border-color:#fff3}
  .btn{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;border:1px solid rgba(255,255,255,.2);background:rgba(16,22,34,.62);backdrop-filter:blur(6px);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .btn.prime{background:linear-gradient(160deg,#ff8a3d,#ff5a0a);border-color:#fff4;color:#fff}
  /* スコアバグ（最下段バー内・映像に重ねない） */
  .scorebug{display:flex;align-items:stretch;border-radius:11px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14)}
  .scorebug .clk{display:flex;align-items:center;padding:0 11px;font:800 15px ui-monospace,monospace;color:#ffe14a;background:rgba(10,14,22,.72)}
  .scorebug .tm{display:flex;align-items:center;gap:7px;padding:7px 12px;background:rgba(16,22,34,.6);font-weight:800}
  .scorebug .tm .chip{width:13px;height:13px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
  .scorebug .tm .n{font:900 21px "Arial Black";letter-spacing:1px;min-width:16px;text-align:center}
  .scorebug .tm.r{flex-direction:row-reverse}
  .scorebug .vs{width:1px;background:rgba(255,255,255,.18)}

  /* ===== 中段・実況帯（キャプ翼の「顔＋吹き出し」を近代化） ===== */
  .talk{height:auto;display:flex;align-items:stretch;gap:0;background:linear-gradient(180deg,#141b28,#0d121c);border-top:1px solid rgba(255,255,255,.09)}
  /* ===== 最下段バー（スコア＋采配＝映像に被せない・画面の一番下） ===== */
  .bottombar{height:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#0a0e17;border-top:1px solid rgba(255,255,255,.08)}
  .bottombar .ctrls{display:flex;align-items:center;gap:8px}
  /* 話者ポートレート（丸フレーム） */
  .face{flex:0 0 auto;width:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 6px}
  .face .ring{width:78px;height:78px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2a3550,#161d2c);border:2.5px solid var(--acc);box-shadow:0 4px 16px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;position:relative}
  .face .ring canvas{width:100%;height:100%;image-rendering:pixelated}
  .face .ring .ph{font-size:40px}
  .face .nm{font-weight:800;font-size:12px;color:#fff}
  .face .role{font-size:10px;color:#8fa0b8}
  /* 実況吹き出し */
  .speechwrap{flex:1;display:flex;align-items:center;padding:14px 20px 14px 4px;position:relative}
  .speech{position:relative;background:linear-gradient(180deg,#fbfdff,#e7edf5);color:#10151f;border-radius:16px;padding:15px 20px;box-shadow:0 6px 20px rgba(0,0,0,.4);width:100%}
  .speech::before{content:"";position:absolute;left:-13px;top:50%;transform:translateY(-50%);border:9px solid transparent;border-right-color:#f4f8fc;filter:drop-shadow(-2px 0 0 rgba(0,0,0,.06))}
  .speech .who{font-weight:800;font-size:11px;color:var(--c1);margin-bottom:3px;letter-spacing:.3px}
  .speech .tx{font:800 clamp(15px,1.9vw,21px)/1.4 "Noto Sans JP",sans-serif}
  .speech .tx .em{color:var(--c1)}

  .cap{color:#7f8ca0;font-size:11px;margin:8px 2px 0}
  #log{color:#c05a5a;font:12px ui-monospace,monospace;margin-top:8px}
</style>
</head>
<body>
<h1>キャプ翼構成の近代化 — 試合画面UI案</h1>
<p class="note">添付（上=映像／下=時刻・スコア・話者顔・実況吹き出し）の骨格を踏襲しつつ近代化：映像は 16:9 で大きく、スコアは放送風の半透明バグを左上へ、下帯は「話者ポートレート（丸フレーム）＋白い実況バブル」。采配・テンポは右上にフロート。ドット枠→ガラス／角丸／グラデ／大きめ日本語。</p>
<div class="stage" id="stage">
  <div class="film" id="film"></div>
  <div class="talk">
    <div class="face">
      <div class="ring" id="faceRing"><span class="ph">🧑🏻</span></div>
      <div class="nm">実況・城</div>
      <div class="role">解説</div>
    </div>
    <div class="speechwrap">
      <div class="speech">
        <div class="who">ロッシ（イタリア）</div>
        <div class="tx">ロッシ、右足一閃——！ <span class="em">ゴール左隅を撃ち抜く</span>、これは意表を突いた！</div>
      </div>
    </div>
  </div>
  <div class="bottombar">
    <div class="scorebug">
      <span class="clk">67&#39;</span>
      <div class="tm"><span class="chip" style="background:#c8102e"></span><span>ITA</span><span class="n">1</span></div>
      <div class="vs"></div>
      <div class="tm r"><span class="chip" style="background:#111"></span><span>GER</span><span class="n">0</span></div>
    </div>
    <div class="ctrls">
      <div class="tempo"><span>1x</span><span class="on">2x</span><span>3x</span></div>
      <div class="btn">🔄</div>
      <div class="btn prime">👔</div>
    </div>
  </div>
</div>
<div class="cap">※話者の丸フレームは実装時に選手ポートレート（Portrait.render）を差し込む。現状は仮アイコン。</div>
<div id="log"></div>

<script src="js/portrait.js?v=t1"></script>
<script src="js/manga_recolor.js?v=t1"></script>
<script src="js/cutscene.js?v=t1"></script>
<script>
window.MANGA_CUTSCENE_ENABLED=true; window.LANG='ja'; CUTSCENE_BURN_LABELS=false;
window.gameState={}; window.getPlayerName=function(p){return p.long_name||p.name;}; window.getTeamName=function(t){return t.__name||'';};
_MANGA_HAIR_UNIFORM='fade';

function shotCanvas(){
  var kit={shirt:'#c8102e',shorts:'#f2f4f7',socks:'#c8102e',accent:'#ffd400'};
  var sc={offence:{__name:'RED',team_color:'#c8102e',kit:kit,players:[{long_name:'Marco Rossi'}],lineup:[0]},
    defence:{__name:'BLU',team_color:'#1050c0',kit:{shirt:'#1050c0',shorts:'#17181c',socks:'#1050c0',accent:'#fff'},players:[{long_name:'Blanc'}],lineup:[0]},
    ofsPos:0,dfsPos:0,action:'シュート',result:'シュート'};
  var entry=(typeof _pickCutscene==='function')?_pickCutscene('shot','#c8102e'):{file:''};
  return _renderShotScene(sc, entry||{file:''});
}
function boot(){
  document.getElementById('film').appendChild(shotCanvas());
  // 話者ポートレートは実装時に Portrait.render を統合。モックでは仮アイコン（絵文字）のまま。
}
var t=0;(function w(){ if((window._pickCutscene&&window.MangaRecolor)||t++>40) boot(); else setTimeout(w,100); })();
</script>
</body>
</html>
