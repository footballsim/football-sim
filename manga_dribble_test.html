<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>manga dribble scene — 実cutscene.js配線テスト</title>
<style>
  body { background:#0e1220; color:#dce3ee; font:13px system-ui,sans-serif; margin:0; padding:16px; }
  h1 { font-size:15px; margin:0 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; max-width:1040px; }
  .frame { background:#000; border-radius:6px; overflow:hidden; aspect-ratio:480/216; }
  .frame canvas { display:block; width:100%; height:100%; object-fit:cover; image-rendering:pixelated; }
  .cap { font-size:12px; color:#8fd6ff; margin:4px 2px 0; }
  #log { font:12px ui-monospace,monospace; color:#9fb0c8; white-space:pre-wrap; margin-top:10px; }
</style>
</head>
<body>
<h1>漫画ドリブルカットイン — 実 cutscene.js `_renderDribbleScene`（→漫画へ分岐）を実行</h1>
<div class="grid" id="grid"></div>
<div id="log"></div>

<!-- 実ファイルをそのまま読み込む（配線の真テスト） -->
<script src="js/portrait.js?v=t"></script>
<script src="js/manga_recolor.js?v=t"></script>
<script src="js/cutscene.js?v=t"></script>
<script>
window.MANGA_CUTSCENE_ENABLED = true;
window.LANG = 'ja';
// cutscene.js が参照する最小スタブ
window.getPlayerName = function (p) { return (window.LANG === 'en' && p.en_name) ? p.en_name : (p.long_name || p.name); };
window.getTeamName = function (t) { return t.__name || ''; };
CUTSCENE_BURN_LABELS = true;   // ラベル/選手名を焼き込んで検証しやすく

// リーグ8チーム相当の実キット＋代表選手名（identity種）
var TEAMS = [
  ['イングランド', '#C8102E', { shirt:'#F2F4F7', shorts:'#1A2A66', socks:'#F2F4F7', accent:'#C8102E' }, 'Jude Bellingham'],
  ['オランダ',   '#FF6600', { shirt:'#EC652B', shorts:'#17181C', socks:'#EC652B', accent:'#17181C' }, 'Cody Gakpo'],
  ['スペイン',   '#AA151B', { shirt:'#B01823', shorts:'#1B2A6B', socks:'#1B2A6B', accent:'#F2C200' }, 'Lamine Yamal'],
  ['フランス',   '#002395', { shirt:'#1A2C6B', shorts:'#F2F4F7', socks:'#C8102E', accent:'#C8102E' }, 'Kylian Mbappe'],
  ['アルゼンチン', '#74ACDF', { shirt:'#74ACDF', shorts:'#17181C', socks:'#F2F4F7', accent:'#F2C200' }, 'Lionel Messi'],
  ['ブラジル',   '#009C3B', { shirt:'#F2C500', shorts:'#1B3A8A', socks:'#F2F4F7', accent:'#1E8C3A' }, 'Vinicius Junior'],
];

var log = function (m) { document.getElementById('log').textContent += m + '\n'; };
var grid = document.getElementById('grid');

// team1 = 攻撃側（右攻め）にして _csAttackRight=true にする
function makeSc(team, success) {
  var offence = {
    __name: team[0], team_color: team[1], kit: team[2],
    players: [{ long_name: team[3], name: team[3] }],
    lineup: [0]
  };
  var defence = { __name: 'イタリア', team_color: '#003DA5',
    kit: { shirt:'#1B4BA0', shorts:'#F2F4F7', socks:'#1B4BA0', accent:'#F2C200' },
    players: [{ long_name: 'Defender ' + team[3] }], lineup: [0] };   // 選手名を変えて守備の髪型も変える
  window.gameState = {};   // team1未設定→_csAttackRightがtrue(右攻め)を返す＝全キャンバス一貫して右攻め（非同期アニメでの共有汚染を回避）
  return { offence: offence, defence: defence, ofsPos: 0, dfsPos: 0, action: 'ドリブル', result: success ? '成功' : '失敗' };
}

TEAMS.forEach(function (team) {
  [true, false].forEach(function (success) {
    var cv = _renderDribbleScene(makeSc(team, success));
    var fr = document.createElement('div'); fr.className = 'frame';
    fr.appendChild(cv);
    var cell = document.createElement('div'); cell.appendChild(fr);
    var cap = document.createElement('div'); cap.className = 'cap';
    var feat = _mangaFeat(team[3]);
    cap.textContent = team[0] + ' — ' + team[3] + ' (' + feat.beard + '_' + feat.hstyle + ') ' + (success ? '成功' : '失敗');
    cell.appendChild(cap);
    grid.appendChild(cell);
    log(team[0] + ' ' + (success ? '成功' : '失敗') + ': ' + feat.beard + '_' + feat.hstyle + ' skin=' + feat.skin);
  });
});
log('DONE — canvases=' + document.querySelectorAll('canvas').length);
window.__DRIB_OK__ = true;
</script>
</body>
</html>
